name: Build QiLong (IPA / TIPA / DEB) - Uncompressed & No Hardening

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装 ldid 与 dpkg
        run: |
          brew install ldid dpkg

      - name: 3. 基础无加固原生编译
        run: |
          make clean
          make

      - name: 4. 组装 .app 目录
        run: |
          mkdir -p QiLong-Dynamic-Whitelist.app
          cp QiLong-Dynamic-Whitelist QiLong-Dynamic-Whitelist.app/
          cp RootHelper QiLong-Dynamic-Whitelist.app/
          cp Info.plist QiLong-Dynamic-Whitelist.app/
          cp src/index.html QiLong-Dynamic-Whitelist.app/
          test -f src/AppIcon.png && cp src/AppIcon.png QiLong-Dynamic-Whitelist.app/ || true
          test -f src/Applcon.png && cp src/Applcon.png QiLong-Dynamic-Whitelist.app/ || true
          if [ -d "packages" ]; then
            cp -r packages/* QiLong-Dynamic-Whitelist.app/ || true
          fi

      - name: 5. 使用 ldid 分轨签署特权 (主UI与RootHelper独立签名)
        run: |
          chmod 0755 QiLong-Dynamic-Whitelist.app/RootHelper
          chmod 0755 QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          ldid -Ssrc/entitlements.plist QiLong-Dynamic-Whitelist.app/RootHelper
          ldid -Ssrc/app_entitlements.plist QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          chmod 0755 QiLong-Dynamic-Whitelist.app/RootHelper
          chmod 0755 QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist

      - name: 6. 纯存储无压缩封装 IPA / TIPA (-0 无压缩模式)
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -RP QiLong-Dynamic-Whitelist.app Payload/
          chmod -R 0755 Payload/
          chmod 0755 Payload/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          chmod 0755 Payload/QiLong-Dynamic-Whitelist.app/RootHelper
          
          # 清理扩展属性
          xattr -cr Payload/ || true
          find Payload/ -name ".DS_Store" -delete
          find Payload/ -name "__MACOSX" -exec rm -rf {} + 2>/dev/null || true
          
          # 使用 -0 纯存储模式打包，完全不进行 Deflate 压缩
          zip -0 -qr QiLong-Dynamic-Whitelist.ipa Payload
          cp -f QiLong-Dynamic-Whitelist.ipa QiLong-Dynamic-Whitelist.tipa

      - name: 7. 纯存储无压缩封装 DEB (-Znone 模式)
        run: |
          rm -rf build_deb
          mkdir -p build_deb/DEBIAN
          mkdir -p build_deb/var/jb/Applications
          cp -RP QiLong-Dynamic-Whitelist.app build_deb/var/jb/Applications/
          chmod -R 0755 build_deb/var/jb/Applications/
          chmod 0755 build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          chmod 0755 build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/RootHelper
          
          cat << 'EOF' > build_deb/DEBIAN/control
          Package: com.78bigqilong.dynamicwhitelist
          Name: QiLong-Dynamic-Whitelist
          Version: 1.0.8
          Architecture: iphoneos-arm64
          Description: QiLong AI 防高动态白名单与安全工具
          Maintainer: 78-big-QiLong
          Author: QiLong-GOLD400
          Section: Utilities
          Depends: firmware (>= 15.0)
          EOF

          cat << 'EOF' > build_deb/DEBIAN/postinst
          #!/bin/sh
          chmod 0755 /var/jb/Applications/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          chmod 0755 /var/jb/Applications/QiLong-Dynamic-Whitelist.app/RootHelper
          uicache -p /var/jb/Applications/QiLong-Dynamic-Whitelist.app 2>/dev/null || uicache -a 2>/dev/null || true
          exit 0
          EOF

          chmod 0755 build_deb/DEBIAN/control
          chmod 0755 build_deb/DEBIAN/postinst
          
          # 使用 -Znone 无压缩打包 DEB
          dpkg-deb -Znone --root-owner-group -b build_deb QiLong-Dynamic-Whitelist_rootless.deb

      - name: 8. 上传 TIPA 安装包 (供 TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-Dynamic-Whitelist-TIPA
          path: QiLong-Dynamic-Whitelist.tipa

      - name: 9. 上传 IPA 安装包 (供自签)
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-Dynamic-Whitelist-IPA
          path: QiLong-Dynamic-Whitelist.ipa

      - name: 10. 上传 DEB 安装包 (供越狱环境)
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-Dynamic-Whitelist-DEB
          path: QiLong-Dynamic-Whitelist_rootless.deb