name: Build QiLong (Independent TIPA / IPA / DEB Targets)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. 拉取源代码
        uses: actions/checkout@v4

      - name: 2. 安装 ldid 与 dpkg
        run: |
          brew install ldid dpkg

      - name: 3. 基础原生编译 (Target & Helper)
        run: |
          make clean
          make

      # =========================================================================
      # 🎯 独立构建流 1：TrollStore 专属 TIPA (包含 TSRootBinaries 与 FakeSign 特权)
      # =========================================================================
      - name: 4. [TIPA 专属构建] 组装并签署 TrollStore 包
        run: |
          rm -rf target_tipa
          mkdir -p target_tipa/Payload/QiLong-Dynamic-Whitelist.app
          
          # 拷贝 Bundle 核心资源
          cp QiLong-Dynamic-Whitelist target_tipa/Payload/QiLong-Dynamic-Whitelist.app/
          cp RootHelper target_tipa/Payload/QiLong-Dynamic-Whitelist.app/
          cp Info.plist target_tipa/Payload/QiLong-Dynamic-Whitelist.app/
          cp src/index.html target_tipa/Payload/QiLong-Dynamic-Whitelist.app/
          test -f src/AppIcon.png && cp src/AppIcon.png target_tipa/Payload/QiLong-Dynamic-Whitelist.app/ || true
          test -f src/Applcon.png && cp src/Applcon.png target_tipa/Payload/QiLong-Dynamic-Whitelist.app/ || true
          if [ -d "packages" ]; then
            cp -r packages/* target_tipa/Payload/QiLong-Dynamic-Whitelist.app/ || true
          fi
          
          # 签署 TrollStore 巨魔特权
          chmod 0755 target_tipa/Payload/QiLong-Dynamic-Whitelist.app/RootHelper
          chmod 0755 target_tipa/Payload/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          ldid -Ssrc/entitlements.plist target_tipa/Payload/QiLong-Dynamic-Whitelist.app/RootHelper
          ldid -Ssrc/app_entitlements.plist target_tipa/Payload/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          
          # 清理扩展属性
          xattr -cr target_tipa/Payload/ || true
          find target_tipa/Payload/ -name ".DS_Store" -delete
          find target_tipa/Payload/ -name "__MACOSX" -exec rm -rf {} + 2>/dev/null || true
          
          # 纯存储 -0 无压缩打包为 .tipa
          cd target_tipa
          zip -0 -qr ../QiLong-Dynamic-Whitelist.tipa Payload
          cd ..

      # =========================================================================
      # 🎯 独立构建流 2：标准自签 IPA (纯净 App Bundle，适配 AltStore/Sideloadly)
      # =========================================================================
      - name: 5. [IPA 专属构建] 组装标准自签 IPA 包
        run: |
          rm -rf target_ipa
          mkdir -p target_ipa/Payload/QiLong-Dynamic-Whitelist.app
          
          # 拷贝 Bundle 核心资源
          cp QiLong-Dynamic-Whitelist target_ipa/Payload/QiLong-Dynamic-Whitelist.app/
          cp RootHelper target_ipa/Payload/QiLong-Dynamic-Whitelist.app/
          cp Info.plist target_ipa/Payload/QiLong-Dynamic-Whitelist.app/
          cp src/index.html target_ipa/Payload/QiLong-Dynamic-Whitelist.app/
          test -f src/AppIcon.png && cp src/AppIcon.png target_ipa/Payload/QiLong-Dynamic-Whitelist.app/ || true
          test -f src/Applcon.png && cp src/Applcon.png target_ipa/Payload/QiLong-Dynamic-Whitelist.app/ || true
          if [ -d "packages" ]; then
            cp -r packages/* target_ipa/Payload/QiLong-Dynamic-Whitelist.app/ || true
          fi
          
          # 签名与权限规范化
          chmod 0755 target_ipa/Payload/QiLong-Dynamic-Whitelist.app/RootHelper
          chmod 0755 target_ipa/Payload/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          ldid -Ssrc/app_entitlements.plist target_ipa/Payload/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          ldid -Ssrc/entitlements.plist target_ipa/Payload/QiLong-Dynamic-Whitelist.app/RootHelper
          
          # 清理扩展属性
          xattr -cr target_ipa/Payload/ || true
          find target_ipa/Payload/ -name ".DS_Store" -delete
          find target_ipa/Payload/ -name "__MACOSX" -exec rm -rf {} + 2>/dev/null || true
          
          # 纯存储 -0 无压缩打包为 .ipa
          cd target_ipa
          zip -0 -qr ../QiLong-Dynamic-Whitelist.ipa Payload
          cd ..

      # =========================================================================
      # 🎯 独立构建流 3：Rootless 越狱 DEB (Dopamine / RootHide / Sileo 架构)
      # =========================================================================
      - name: 6. [DEB 专属构建] 组装与编译 Rootless DEB 安装包
        run: |
          rm -rf build_deb
          mkdir -p build_deb/DEBIAN
          mkdir -p build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app
          
          # 拷贝 Bundle 核心资源至越狱系统目录
          cp QiLong-Dynamic-Whitelist build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/
          cp RootHelper build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/
          cp Info.plist build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/
          cp src/index.html build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/
          test -f src/AppIcon.png && cp src/AppIcon.png build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/ || true
          test -f src/Applcon.png && cp src/Applcon.png build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/ || true
          if [ -d "packages" ]; then
            cp -r packages/* build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/ || true
          fi
          
          # 签署 Rootless 越狱特权
          chmod 0755 build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/RootHelper
          chmod 0755 build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          ldid -Ssrc/entitlements.plist build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/RootHelper
          ldid -Ssrc/app_entitlements.plist build_deb/var/jb/Applications/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          
          # 写入 DEBIAN 控制脚本
          cat << 'EOF' > build_deb/DEBIAN/control
          Package: com.78bigqilong.dynamicwhitelist
          Name: QiLong-Dynamic-Whitelist
          Version: 1.0.8
          Architecture: iphoneos-arm64
          Description: QiLong AI 防高动态白名单与安全工具 (Rootless)
          Maintainer: 78-big-QiLong
          Author: QiLong-GOLD400
          Section: Utilities
          Depends: firmware (>= 15.0)
          EOF

          cat << 'EOF' > build_deb/DEBIAN/postinst
          #!/bin/sh
          chmod 0755 /var/jb/Applications/QiLong-Dynamic-Whitelist.app/QiLong-Dynamic-Whitelist
          chmod 0755 /var/jb/Applications/QiLong-Dynamic-Whitelist.app/RootHelper
          uicache -p /var/jb/Applications/QiLong-Dynamic-Whitelist.app 2>/dev/null || uicache -a 2>/dev/null || true
          exit 0
          EOF

          cat << 'EOF' > build_deb/DEBIAN/postrm
          #!/bin/sh
          uicache -a 2>/dev/null || true
          exit 0
          EOF

          chmod 0755 build_deb/DEBIAN/control
          chmod 0755 build_deb/DEBIAN/postinst
          chmod 0755 build_deb/DEBIAN/postrm
          
          # 封装为无压缩 -Znone 规范 DEB
          dpkg-deb -Znone --root-owner-group -b build_deb QiLong-Dynamic-Whitelist_rootless.deb

      # =========================================================================
      # 📦 分流独立产物上传
      # =========================================================================
      - name: 7. 上传 TIPA 安装包 (TrollStore 专属)
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-Dynamic-Whitelist-TIPA
          path: QiLong-Dynamic-Whitelist.tipa

      - name: 8. 上传 IPA 安装包 (标准自签专属)
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-Dynamic-Whitelist-IPA
          path: QiLong-Dynamic-Whitelist.ipa

      - name: 9. 上传 DEB 安装包 (Dopamine/RootHide 越狱专属)
        uses: actions/upload-artifact@v4
        with:
          name: QiLong-Dynamic-Whitelist-DEB
          path: QiLong-Dynamic-Whitelist_rootless.deb